add_newline = true

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#45476a'  # surface2

[character]
success_symbol = "[ ](bold fg:#d68399)"  
error_symbol = "[ ](bold fg:#214e42)"    

[package]
disabled = true

[git_branch]
symbol = "󰘬"
truncation_length = 13
truncation_symbol = ""
format = " 󰜥 [](fg:#313245)[$symbol $branch(:$remote_branch)](fg:#cdd6f4 bg:#313244)[ ](fg:#313244)"

[git_commit]
commit_hash_length = 5
tag_symbol = " "

[git_state]
cherry_pick = "[🍒 PICKING](bold fg:#f39ba8)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 "
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](fg:#a7e3a1)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:#313245 fg:#cdd6f4)[](fg:#313244)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true

[time]
disabled = true

[username]
style_user = "bold bg:#313245 fg:#cdd6f4"
style_root = "red bold"
format = "[](fg:#313245)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#313245 fg:#cdd6f4"
truncation_length = 3
truncation_symbol = ".../"
format = '[](fg:#313245)[󰉋 → $path]($style)[](fg:#313244)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 1
format = '[](fg:#313245)[󰪢 $duration](bg:#313244 fg:#cdd6f4)[](fg:#313244)'

